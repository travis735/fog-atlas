# V3 forecast engine — hourly shadow-mode issuance.
#
# INERT until two repository secrets exist (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   account-scoped token: Workers KV Storage:Edit
#                          (+ Pages:Edit, R2:Edit for later phases)
# Account id is not a secret; it's public in wrangler.toml deploys.
name: forecast
on:
  # GitHub's schedule is best-effort (3 runs/day by Nov 2026), so the real
  # clock is the fogatlas-cron Cloudflare Worker (cron/), which dispatches this
  # workflow hourly at :25 with force_bake=false. This cron stays as a fallback.
  schedule:
    - cron: "25 * * * *"   # hourly at :25 — NBM mirror lag margin
  workflow_dispatch:
    inputs:
      force_bake:
        description: "Rebuild and deploy the pages even if today's bake already ran. Leave on for a manual redeploy; the hourly cron Worker sends false so it follows the once-a-day bake gate."
        type: boolean
        default: true

# One run at a time. The planner step reads the live payload from KV, carries
# day-level chances forward from it and writes the result back, so two
# overlapping runs (the Worker's tick and GitHub's own schedule firing
# together, or a person's dispatch during a tick) could each build on the
# payload the other is about to replace. Queued, not cancelled: a run in
# progress always finishes. It also keeps the two triggers from both seeing
# yesterday's pages at the 10z tick and baking twice.
concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # the daily bake fetches ~140 AWC batches; a throttled AWC once stretched
    # it past the old 25-minute cap and the job was cancelled mid-deploy
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: 5488aa3505290f21c3be9c32b2a5949c
      KV_NAMESPACE: 72edf0ce3b1944bca59e4aa47cb67cc4
    steps:
      - name: gate on secret
        id: gate
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "no CLOUDFLARE_API_TOKEN secret — engine idle (shadow mode not started via CI)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with: { python-version: "3.12" }
      # pinned, not the runner's preinstalled Node: 24.22.1 is the 2026-10-21
      # security release (Brotli RCE, TLS hostname bypasses, eMudhra CA) — bump deliberately
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.enabled == 'true'
        with: { node-version: "24.22.1" }
      - name: engine
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install --quiet -c .github/pip-constraints.txt duckdb pyshp eccodes
          python forecast/engine.py
      - name: upload the issuance to KV + R2 (the hourly product — never waits on the daily bake)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.167.0 kv key put current \
            --path forecast/out/current.json --namespace-id "$KV_NAMESPACE" --remote
          LOG=$(ls forecast/out/log/run_*.json.gz | tail -1)
          # R2 is the log home; KV fallback keeps the record unbroken if the
          # token lacks R2 scope (migrate strays with the next R2-capable run)
          npx --yes wrangler@4.167.0 r2 object put \
            "fogatlas-forecast/logs/$(basename "$LOG")" --file "$LOG" --remote \
          || npx --yes wrangler@4.167.0 kv key put "log:$(basename "$LOG" .json.gz)" \
            --path "$LOG" --namespace-id "$KV_NAMESPACE" --remote
      # ---- the DEPLOY planner, rebuilt on EVERY run (since 2026-11-25) ----
      # It was built once a day with the page bake, so the pilot read a plan 14
      # to 20 hours old above an hourly curve that was fresh. Three steps:
      # fetch what is live (to carry from), build, upload + read back. None of
      # them can stop the page bake below, and the hourly issuance is already
      # in KV by now; a failure in any of them fails the run in the last step.
      # Each of the three has its own time limit. Their socket timeouts add up
      # to more than the job's 40 minutes (five NBE cycles at 180 s, 90 GEFS
      # member fetches at up to 180 s over ten threads), so one hung NOAA
      # mirror could have run the job out before the bake, and a cancelled job
      # skips the bake and both "surface" steps. A build takes 35 to 55 s.
      - name: deploy planner — fetch the live payload (what this build may carry a day-level chance from)
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 4
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # Never a failure. Absent, unreadable or old-format only means this
          # build carries nothing; build_deploy.py records which in meta.carry.
          PREV="$RUNNER_TEMP/deploy_prev.json"
          if npx --yes wrangler@4.167.0 kv key get deploy \
               --namespace-id "$KV_NAMESPACE" --remote > "$PREV" 2> "$RUNNER_TEMP/deploy_prev.err"; then
            echo "live planner payload: $(wc -c < "$PREV") bytes"
          else
            echo "::warning::deploy planner: could not read the live payload from KV — this build carries nothing forward"
            tail -n 5 "$RUNNER_TEMP/deploy_prev.err" || true
            rm -f "$PREV"
          fi
      - name: deploy planner — build from this issuance
        id: planner
        if: steps.gate.outputs.enabled == 'true'
        timeout-minutes: 8
        continue-on-error: true   # the real outcome fails the run at the end, after the bake
        run: python forecast/build_deploy.py --previous "$RUNNER_TEMP/deploy_prev.json"
      - name: deploy planner — upload to KV, log the build to R2, read the payload back
        id: planner_up
        if: steps.gate.outputs.enabled == 'true' && steps.planner.outcome == 'success'
        timeout-minutes: 4
        continue-on-error: true   # the real outcome fails the run at the end, after the bake
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4.167.0 kv key put deploy \
            --path forecast/out/deploy.json --namespace-id "$KV_NAMESPACE" --remote
          # One log per build (the name carries the cycle and the build time),
          # so the day-level chance of every cycle hour can be re-scored later.
          # A fresh runner holds exactly one. Not best-effort: a build that
          # is live and cannot be scored is a failure to see.
          # BEFORE the read-back, since 2026-11-25: the log describes the build
          # whether or not the read-back confirms the put, and a read-back
          # that failed on the read side (KV slow to show the write) used to
          # skip this and leave a live payload with no log on any runner.
          DLOG=$(ls forecast/out/deploylog/deploy_*.json.gz | tail -1)
          logged=true
          if ! npx --yes wrangler@4.167.0 r2 object put \
               "fogatlas-forecast/deploylogs/$(basename "$DLOG")" --file "$DLOG" --remote; then
            echo "::error::deploy planner: the payload was put to KV, but its log $(basename "$DLOG") did not reach R2"
            logged=false
          fi
          # A KV put has reported success and not landed for this project
          # before, and nothing downstream would notice for hours. Read the
          # key back and compare meta.generated with the file just built.
          # Three reads at most (KV takes a moment to show a write): never a
          # loop without an end against a metered API.
          BACK="$RUNNER_TEMP/deploy_back.json"
          landed=false
          for pause in 0 10 20; do
            sleep "$pause"
            npx --yes wrangler@4.167.0 kv key get deploy \
              --namespace-id "$KV_NAMESPACE" --remote > "$BACK" 2>/dev/null || true
            if python forecast/build_deploy.py --same-build forecast/out/deploy.json "$BACK"; then
              landed=true; break
            fi
          done
          if [ "$landed" != "true" ]; then
            # not "the put did not land": three reads in 30 s cannot tell a
            # lost write from a slow one. /api/deploy's meta.generated can.
            echo "::error::deploy planner: KV did not return the payload this run built within 30 s of the put (three reads) — either the put did not land or KV is slow to show it; meta.generated on /api/deploy says which"
            exit 1
          fi
          [ "$logged" = "true" ] || exit 1
      - name: bake gate — does the live site still need today's bake?
        id: bake
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # A clock gate (HOUR == 10) silently lost whole days: GitHub's cron
          # drifts and sheds runs, so no run may ever START inside 10z. Ask the
          # live site when it last baked instead — the first run at/after
          # 10z that finds a bake from before today's 10:00Z bakes.
          # A dispatch from a person means "redeploy now" (force_bake defaults
          # to true). The cron Worker dispatches every hour with
          # force_bake=false and must fall through to the state gate below:
          # its first tick ran the full 5-minute bake + Pages deploy + IndexNow
          # ping, which would otherwise have happened 24 times a day.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_bake }}" != "false" ]; then
            echo "manual dispatch — baking"
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR=$((10#$(date -u +%H)))
          TODAY=$(date -u +%F)
          if [ "$HOUR" -lt 10 ]; then
            echo "before 10z — today's bake not owed yet"
            echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The page's own bake time ("2026-11-25T02:59Z") against today's
          # 10:00Z: "stale" when it was baked before that, "fresh" otherwise.
          # It was the bake DATE against today's date, so a redeploy by hand
          # between 00Z and 10Z (2026-11-25, 02:58Z) made the page "today's"
          # and every tick of the day skipped the bake: the next one came
          # 31 hours later, with the watchdog's bake check green throughout.
          probe() {
            curl -sf --max-time 30 https://fogatlas.org/fog/ksfo/data.json | python3 -c '
          import json, sys
          from datetime import datetime, timezone
          u = json.load(sys.stdin)["updated"]
          t = datetime.strptime(u, "%Y-%m-%dT%H:%MZ").replace(tzinfo=timezone.utc)
          owed = datetime.now(timezone.utc).replace(hour=10, minute=0, second=0, microsecond=0)
          print(u, "stale" if t < owed else "fresh")' 2>/dev/null
          }
          # one more try after a pause before calling it unreadable
          READ=$(probe) || { sleep 20; READ=$(probe) || READ="unreadable unreadable"; }
          LIVE=${READ% *}; STATE=${READ##* }
          echo "live bake: $LIVE / owed since: ${TODAY}T10:00Z / $STATE"
          # The page's bake time is the whole gate again. For one day
          # (2026-11-25) a second probe also baked when the planner payload's
          # day 1 was not tomorrow, because the planner was built by the bake
          # and a bake before 10z could leave it a day behind. The planner is
          # now built by every run, above, whether or not the pages bake. Kept,
          # that probe would turn one failed planner build after 10z into a
          # full bake + Pages deploy + IndexNow ping on every tick until the
          # planner recovered, and a bake no longer rebuilds the planner.
          if [ "$STATE" = "stale" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATE" = "fresh" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          elif [ "$HOUR" -le 11 ]; then
            # Fail open, on the day's first two ticks only: an unreadable probe
            # then costs one idempotent rebuild, never a stale day. It used to
            # fail open on every tick, which under the hourly clock is up to
            # 14 bakes, Pages deploys and IndexNow pings a day, each one green.
            echo "::warning::bake gate: the live page's bake time could not be read (two tries) — baking, as the gate does on the day's first two ticks"
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::bake gate: the live page's bake time could not be read (two tries) — not baking on this tick; the watchdog's bake check reports a page that is a day old"
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi
      - name: restore the last-good AWC TAF/METAR snapshot (reused only while <30 h old)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: forecast/out/awc_cache.json
          key: awc-${{ github.run_id }}
          restore-keys: awc-
      - name: restore the last-good NWS point-forecast snapshot (reused only while <30 h old)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          # its own step, not a second path on the AWC step: actions/cache
          # hashes the path list into the cache version, so widening the AWC
          # step's paths would have made every existing awc-* cache invisible
          # (a cold start for the TAF/METAR fallback too, not just this layer)
          path: forecast/out/nws_cache.json
          key: nws-${{ github.run_id }}
          restore-keys: nws-
      - name: rebuild fog pages + deploy site (daily, with the bake)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"   # the bake's AWC progress lines must reach the log as they happen
        run: |
          # pages are deploy-time artifacts (gitignored): bake today's
          # answers from the issuance the engine just wrote, then ship
          python forecast/build_pages.py
          cd app && npm ci --no-audit --no-fund && npx vite build
          npx --yes wrangler@4.167.0 pages deploy dist --project-name=fog-atlas
      - name: log the NWS fog mentions to R2 (future verification)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # every US airport's quoted NWS point-forecast fog mentions from this
          # bake — kept per day so a later pass can score "patchy fog" against
          # METAR truth. Best-effort: a failed upload never fails the deploy.
          if [ -f forecast/out/nws_mentions.json ]; then
            NAME="nws_$(date -u +%Y%m%dT%H%M).json.gz"
            gzip -c forecast/out/nws_mentions.json > "$RUNNER_TEMP/$NAME"
            npx --yes wrangler@4.167.0 r2 object put \
              "fogatlas-forecast/nws/$NAME" --file "$RUNNER_TEMP/$NAME" --remote || true
          fi
      - name: ping IndexNow with today's changed URLs
        id: indexnow
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        continue-on-error: true   # the real outcome fails the run at the end
        run: python forecast/ping_indexnow.py
      # ---- failures that were not allowed to stop the steps above ----
      # !cancelled() so each still reports when a later step (the bake) failed
      # the job outright; both may fire, and either one fails the run.
      - name: surface a DEPLOY planner failure (the issuance, and the pages if they baked, are already live)
        # "not success", not "failure": a step ended by its timeout-minutes must
        # be surfaced whatever outcome the runner gives it. planner_up is
        # skipped only when the build did not succeed, which the first test covers.
        if: ${{ !cancelled() && steps.gate.outputs.enabled == 'true' && (steps.planner.outcome != 'success' || steps.planner_up.outcome != 'success') }}
        run: |
          echo "::error::DEPLOY planner: build ${{ steps.planner.outcome }}, upload ${{ steps.planner_up.outcome }} — /api/deploy still serves the previous build (or this build is live without its log); see those two steps"
          exit 1
      - name: surface an IndexNow failure (issuance already safe in KV)
        if: ${{ !cancelled() && steps.indexnow.outcome == 'failure' }}
        run: |
          echo "::error::IndexNow ping failed — see the 'ping IndexNow' step log"
          exit 1
