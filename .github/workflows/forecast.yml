# V3 forecast engine — hourly shadow-mode issuance.
#
# INERT until two repository secrets exist (Settings -> Secrets -> Actions):
#   CLOUDFLARE_API_TOKEN   account-scoped token: Workers KV Storage:Edit
#                          (+ Pages:Edit, R2:Edit for later phases)
# Account id is not a secret; it's public in wrangler.toml deploys.
name: forecast
on:
  schedule:
    - cron: "25 * * * *"   # hourly at :25 — NBM mirror lag margin
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    # the daily bake fetches ~140 AWC batches; a throttled AWC once stretched
    # it past the old 25-minute cap and the job was cancelled mid-deploy
    timeout-minutes: 40
    env:
      CLOUDFLARE_ACCOUNT_ID: 5488aa3505290f21c3be9c32b2a5949c
      KV_NAMESPACE: 72edf0ce3b1944bca59e4aa47cb67cc4
    steps:
      - name: gate on secret
        id: gate
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "no CLOUDFLARE_API_TOKEN secret — engine idle (shadow mode not started via CI)"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.enabled == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.enabled == 'true'
        with: { python-version: "3.12" }
      - name: engine
        if: steps.gate.outputs.enabled == 'true'
        run: |
          pip install --quiet duckdb pyshp eccodes
          python forecast/engine.py
      - name: upload the issuance to KV + R2 (the hourly product — never waits on the daily bake)
        if: steps.gate.outputs.enabled == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@4 kv key put current \
            --path forecast/out/current.json --namespace-id "$KV_NAMESPACE" --remote
          LOG=$(ls forecast/out/log/run_*.json.gz | tail -1)
          # R2 is the log home; KV fallback keeps the record unbroken if the
          # token lacks R2 scope (migrate strays with the next R2-capable run)
          npx --yes wrangler@4 r2 object put \
            "fogatlas-forecast/logs/$(basename "$LOG")" --file "$LOG" --remote \
          || npx --yes wrangler@4 kv key put "log:$(basename "$LOG" .json.gz)" \
            --path "$LOG" --namespace-id "$KV_NAMESPACE" --remote
      - name: bake gate — does the live site still need today's bake?
        id: bake
        if: steps.gate.outputs.enabled == 'true'
        run: |
          # A clock gate (HOUR == 10) silently lost whole days: GitHub's cron
          # drifts and sheds runs, so no run may ever START inside 10z. Ask the
          # live site what day it last baked instead — the first run at/after
          # 10z that finds it stale bakes. Fail-open: an unreadable probe costs
          # one idempotent rebuild, never a stale day.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "manual dispatch — baking"
            echo "needed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          HOUR=$((10#$(date -u +%H)))
          TODAY=$(date -u +%F)
          if [ "$HOUR" -lt 10 ]; then
            echo "before 10z — today's bake not owed yet"
            echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          LIVE=$(curl -sf --max-time 30 https://fogatlas.org/fog/ksfo/data.json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["updated"][:10])' \
            || echo unreadable)
          echo "live bake: $LIVE / today: $TODAY"
          if [ "$LIVE" = "$TODAY" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: restore the last-good AWC TAF/METAR snapshot (reused only while <30 h old)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          path: forecast/out/awc_cache.json
          key: awc-${{ github.run_id }}
          restore-keys: awc-
      - name: restore the last-good NWS point-forecast snapshot (reused only while <30 h old)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        uses: actions/cache@v4
        with:
          # its own step, not a second path on the AWC step: actions/cache
          # hashes the path list into the cache version, so widening the AWC
          # step's paths would have made every existing awc-* cache invisible
          # (a cold start for the TAF/METAR fallback too, not just this layer)
          path: forecast/out/nws_cache.json
          key: nws-${{ github.run_id }}
          restore-keys: nws-
      - name: deploy planner data (daily, with the bake)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        run: python forecast/build_deploy.py
      - name: rebuild fog pages + deploy site (daily, with the bake)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PYTHONUNBUFFERED: "1"   # the bake's AWC progress lines must reach the log as they happen
        run: |
          # pages are deploy-time artifacts (gitignored): bake today's
          # answers from the issuance the engine just wrote, then ship
          python forecast/build_pages.py
          cd app && npm ci --no-audit --no-fund && npx vite build
          npx --yes wrangler@4 pages deploy dist --project-name=fog-atlas
      - name: log the NWS fog mentions to R2 (future verification)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # every US airport's quoted NWS point-forecast fog mentions from this
          # bake — kept per day so a later pass can score "patchy fog" against
          # METAR truth. Best-effort: a failed upload never fails the deploy.
          if [ -f forecast/out/nws_mentions.json ]; then
            NAME="nws_$(date -u +%Y%m%dT%H%M).json.gz"
            gzip -c forecast/out/nws_mentions.json > "$RUNNER_TEMP/$NAME"
            npx --yes wrangler@4 r2 object put \
              "fogatlas-forecast/nws/$NAME" --file "$RUNNER_TEMP/$NAME" --remote || true
          fi
      - name: ping IndexNow with today's changed URLs
        id: indexnow
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        continue-on-error: true   # the real outcome fails the run at the end, after the KV upload
        run: python forecast/ping_indexnow.py
      - name: upload the deploy-planner data to KV + R2 (daily, with the bake)
        if: steps.gate.outputs.enabled == 'true' && steps.bake.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -f forecast/out/deploy.json ]; then
            npx --yes wrangler@4 kv key put deploy \
              --path forecast/out/deploy.json --namespace-id "$KV_NAMESPACE" --remote
            DLOG=$(ls forecast/out/deploylog/deploy_*.json.gz | tail -1)
            npx --yes wrangler@4 r2 object put \
              "fogatlas-forecast/deploylogs/$(basename "$DLOG")" --file "$DLOG" --remote || true
          fi
      - name: surface an IndexNow failure (issuance already safe in KV)
        if: steps.indexnow.outcome == 'failure'
        run: |
          echo "::error::IndexNow ping failed — see the 'ping IndexNow' step log"
          exit 1
