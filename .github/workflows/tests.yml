# Unit tests for the forecast engine, NBM parser, calibration and shadow
# scorecard. Fully offline: every network call is stubbed, so this needs no
# secrets and runs on forks.
name: tests
on:
  push:
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: forecast/requirements-test.txt
      - name: install
        run: pip install --quiet -r forecast/requirements-test.txt
      - name: pytest
        run: pytest
