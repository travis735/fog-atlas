    <style>
      /* DEPLOY planner: text with more behind it. A hover shows it; a tap opens
         it in a line underneath, because a phone has no hover. */
      .dtip { border-bottom: 1px dotted currentColor; cursor: help; }
      .dtip-line {
        display: block; margin: 3px 0 4px; padding: 5px 8px; white-space: normal;
        border-left: 2px solid #3a5670; background: #0e1620; color: #d7e3ee;
        font-size: 10.5px; line-height: 1.5; letter-spacing: 0;
      }
      /* LED approach lights: the tick beside ILS, LPV and NOW, its chip, the
         tag on a runway end and the popup on a ring. Violet is used for
         nothing else on the page (blue is fog, amber and red are live fog). */
      #led-toggle {
        display: flex; align-items: center; gap: 6px; padding: 9px 12px;
        background: var(--panel); border: 1px solid var(--hairline); border-radius: 9px;
        color: var(--ink-dim); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
        cursor: pointer; backdrop-filter: blur(12px); user-select: none;
      }
      #led-toggle:hover { color: var(--ink); }
      #led-toggle input { accent-color: #c79bff; }
      /* an older chase.json has no LED data: the tick is off and its title says why */
      #led-toggle.off { opacity: 0.45; cursor: not-allowed; }
      #led-toggle.off:hover { color: var(--ink-dim); }
      #led-chip {
        padding: 9px 12px; background: var(--panel); border: 1px solid #5b4480;
        border-radius: 9px; color: #d9bcff; font-size: 11px; letter-spacing: 0.06em;
        backdrop-filter: blur(12px); max-width: 100%;
      }
      #led-chip.old { border-color: #7a5a2e; color: #ffb347; }
      #led-chip .led-dot {
        display: inline-block; width: 9px; height: 9px; margin-right: 7px; vertical-align: -1px;
        border: 1.6px solid #c79bff; border-radius: 50%; box-sizing: border-box;
      }
      /* fog alerts are still being checked while the CHASE board is not on screen */
      #chase-btn.watching::after { content: " \25CF"; color: #7fd49a; }
      .pill.led { background: #2a1f3d; color: #d9bcff; border: 1px solid #5b4480; white-space: nowrap; }
      /* LED by an old FAA list or at an airport whose runway is not named: amber, a tag to read before trusting */
      .pill.led.soft { background: #3a2c12; color: #ffcf8a; border-color: #8a6a2a; }
      .led-other { color: #c79bff; }
      /* three classes: style.css's .tip rule (same popup, loaded after this block) must not take the padding back,
         or the airport's name runs under the close button */
      .maplibregl-popup.tip.led-pop .maplibregl-popup-content { padding: 9px 28px 9px 12px; }
      .led-pop .maplibregl-popup-close-button { color: var(--ink-dim); font-size: 17px; padding: 2px 7px; }
      .led-pop .maplibregl-popup-close-button:hover { color: var(--ink); background: transparent; }
      .led-pop .led-pop-h { margin-top: 5px; color: #d9bcff; font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; }
      .led-pop .led-pop-end { color: var(--accent-hot); }
      .led-pop .led-pop-note { margin-top: 4px; color: var(--ink-dim); font-size: 10.5px; line-height: 1.45; }
      .led-pop a { color: var(--accent); }
    </style>

  <body>
    <div id="map"></div>
    <noscript>
      <main style="max-width:680px;margin:40px auto;padding:0 16px;font-family:sans-serif">
        <h1>Fog Atlas — live world fog map</h1>
        <p>A free reference for "will it be foggy tomorrow?": a live map of
        every airport currently below approach minima, daily fog forecasts and
        ten-year fog climatology for 3,497 airports and 3,000+ cities worldwide,
        built from ten years of METAR weather observations (NOAA / Iowa
        Environmental Mesonet), National Weather Service model guidance, and FAA
        airport data — every forecast logged and publicly verified. The
        interactive map needs JavaScript, but every airport and city has a
        static page:</p>
        <p><a href="/fog/forecast/"><b>Where will it be foggy tomorrow?</b></a> ·
        <a href="/fog/">Airport fog forecasts</a> ·
        <a href="/fog/city/">City fog forecasts</a> ·
        <a href="/fog/region/central-valley/">Tule fog (Central Valley)</a> ·
        <a href="/fog/foggiest-airports/">Foggiest airports</a> ·
        <a href="/fog/scorecard/">Forecast verification</a> ·
        <a href="/methodology/">Methodology</a> ·
        <a href="/about/">About</a> ·
        <a href="/llms.txt">Machine-readable guide</a></p>
      </main>
    </noscript>

    <div id="topbar-row">
    <div id="topleft">
    <div id="brandrow">
    <header id="brand">
      <h1>FOG ATLAS</h1>
      <p>where the sky closes &middot; 2016&ndash;2025 METAR climatology</p>
    </header>
      <div id="search">
        <input id="search-input" type="text" placeholder="search airport — ICAO, name, country" autocomplete="off" spellcheck="false" />
        <div id="search-results" hidden></div>
      </div>
    </div>

    <div id="topbar">
      <button id="rankings-btn">rankings</button>
      <button id="chase-btn" title="Fog chasing for EFVS testing — filter airports by approach lighting, runway length, minima and RVR equipment; distance and still-air flight time from your base. Live fog lands on the board in real time.">chase</button>
      <button id="deploy-btn" title="Where to base for the next two weeks: expected chaseable fog hours by candidate base — a checked forecast for the plan's first day, labeled advisory tiers after that — against your saved chase filters. Rebuilt every hour; the panel says how old the plan is.">deploy</button>
      <label id="ils-toggle" title="Hide airports with no ILS on record (US, per FAA NASR — RNAV-only fields have higher minima than CAT I). International airports with unknown ILS status stay visible.">
        <input id="ils-only" type="checkbox" /> ILS
      </label>
      <label id="lpv-toggle" title="Hide airports without an LPV approach (US: FAA CIFP SBAS path points; Europe: ESSP EGNOS operational LPV procedures). Airports with unknown LPV status elsewhere stay visible.">
        <input id="lpv-only" type="checkbox" /> LPV
      </label>
      <label id="now-toggle" title="Show airports below CAT I minima RIGHT NOW, worldwide — from NOAA's live METAR feed, refreshed every ~3 minutes. Amber = EFVS-recoverable, red = below 300 m.">
        <input id="now-mode" type="checkbox" /> NOW
      </label>
      <label id="led-toggle" title="Ring the airports where an FAA airport remark says a runway end has LED approach lights. An infrared EFVS may not see LED lights. Limits: FAA-owned systems in the US only, and a remark can follow the installation by months. No ring is not proof of incandescent lamps.">
        <input id="led-show" type="checkbox" /> LED
      </label>
      <span id="now-chip" hidden></span>
      <span id="led-chip" hidden></span>
    </div>
    </div><!-- /topleft -->

    </div><!-- /topbar-row -->

    <div id="legend">
      <div class="legend-row"><span class="dot glow"></span> fog field — % of hours below CAT I at scrubbed month &amp; local hour</div>
      <div class="legend-row"><span class="dot annual"></span> faint points — analyzed airports · zoom in for per-airport dots</div>
    </div>

    <footer id="scrub">
      <button id="play" aria-label="play">&#9654;</button>
      <div class="sliders">
        <div id="months" title="click a month · drag for a range · ⌘/ctrl-click to add months (e.g. Nov+Dec+Jan)"></div>
        <label>local hour <input id="hr" type="range" min="0" max="23" value="6" /></label>
      </div>
      <div id="readout">January &middot; 06:00</div>
    </footer>

    <aside id="panel" hidden>
      <button id="close" aria-label="close">&times;</button>
      <div id="panel-content"></div>
    </aside>

    <a id="methodology" href="#methodology">methodology &amp; caveats</a>

    <script type="module" src="/src/main.ts"></script>
