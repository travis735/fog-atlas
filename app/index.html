<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Fog Atlas — where the sky closes</title>
    <meta name="description" content="Ten years of METAR observations distilled into when and where airports drop below approach minima — and how much of it EFVS gets back." />
  </head>
  <body>
    <div id="map"></div>

    <header id="brand">
      <h1>FOG ATLAS</h1>
      <p>where the sky closes &middot; 2016&ndash;2025 METAR climatology</p>
    </header>

    <div id="topbar">
      <div id="search">
        <input id="search-input" type="text" placeholder="search airport — ICAO, name, country" autocomplete="off" spellcheck="false" />
        <div id="search-results" hidden></div>
      </div>
      <button id="rankings-btn">rankings</button>
      <label id="ils-toggle" title="Hide airports with no ILS on record (US, per FAA NASR — RNAV-only fields have higher minima than CAT I). International airports with unknown ILS status stay visible.">
        <input id="ils-only" type="checkbox" /> ILS
      </label>
      <label id="lpv-toggle" title="Hide airports without an LPV approach (US, per FAA CIFP SBAS path points). Non-US airports have unknown LPV status (EGNOS not yet ingested) and stay visible.">
        <input id="lpv-only" type="checkbox" /> LPV
      </label>
    </div>

    <div id="legend">
      <div class="legend-row"><span class="dot glow"></span> fog field — % of hours below CAT I at scrubbed month &amp; local hour</div>
      <div class="legend-row"><span class="dot annual"></span> faint points — analyzed airports · zoom in for per-airport dots</div>
    </div>

    <footer id="scrub">
      <button id="play" aria-label="play">&#9654;</button>
      <div class="sliders">
        <div id="months" title="click a month · drag for a range · ⌘/ctrl-click to add months (e.g. Nov+Dec+Jan)"></div>
        <label>local hour <input id="hr" type="range" min="0" max="23" value="6" /></label>
      </div>
      <div id="readout">January &middot; 06:00</div>
    </footer>

    <aside id="panel" hidden>
      <button id="close" aria-label="close">&times;</button>
      <div id="panel-content"></div>
    </aside>

    <a id="methodology" href="#methodology">methodology &amp; caveats</a>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
