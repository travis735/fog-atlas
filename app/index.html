      <main style="max-width:680px;margin:40px auto;padding:0 16px;font-family:sans-serif">
        <h1>Fog Atlas — live world fog map</h1>
        <p>A free reference for "will it be foggy tomorrow?": a live map of
        every airport currently below approach minima, daily fog forecasts and
        ten-year fog climatology for 3,497 airports and 3,000+ cities worldwide,
        built from ten years of METAR weather observations (NOAA / Iowa
        Environmental Mesonet), National Weather Service model guidance, and FAA
        airport data — every forecast logged and publicly verified. The
        interactive map needs JavaScript, but every airport and city has a
        static page:</p>
        <p><a href="/fog/">Airport fog forecasts</a> ·
        <a href="/fog/city/">City fog forecasts</a> ·
        <a href="/fog/region/central-valley/">Tule fog (Central Valley)</a> ·
        <a href="/fog/foggiest-airports/">Foggiest airports</a> ·
        <a href="/fog/scorecard/">Forecast verification</a> ·
        <a href="/methodology/">Methodology</a> ·
        <a href="/about/">About</a> ·
        <a href="/llms.txt">Machine-readable guide</a></p>
      </main>
    </noscript>

    <div id="topbar-row">
    <div id="topleft">
    <div id="brandrow">
    <header id="brand">
      <h1>FOG ATLAS</h1>
      <p>where the sky closes &middot; 2016&ndash;2025 METAR climatology</p>
    </header>
      <div id="search">
        <input id="search-input" type="text" placeholder="search airport — ICAO, name, country" autocomplete="off" spellcheck="false" />
        <div id="search-results" hidden></div>
      </div>
    </div>

    <div id="topbar">
      <button id="rankings-btn">rankings</button>
      <button id="chase-btn" title="Fog chasing for EFVS testing — filter airports by approach lighting, runway length, minima and RVR equipment; distance and still-air flight time from your base. Live fog lands on the board in real time.">chase</button>
      <button id="deploy-btn" title="Where to base for the next two weeks: expected chaseable fog hours by candidate base — calibrated 48 h forecast plus labeled advisory tiers — against your saved chase filters.">deploy</button>
      <label id="ils-toggle" title="Hide airports with no ILS on record (US, per FAA NASR — RNAV-only fields have higher minima than CAT I). International airports with unknown ILS status stay visible.">
        <input id="ils-only" type="checkbox" /> ILS
      </label>
      <label id="lpv-toggle" title="Hide airports without an LPV approach (US: FAA CIFP SBAS path points; Europe: ESSP EGNOS operational LPV procedures). Airports with unknown LPV status elsewhere stay visible.">
        <input id="lpv-only" type="checkbox" /> LPV
      </label>
      <label id="now-toggle" title="Show airports below CAT I minima RIGHT NOW, worldwide — from NOAA's live METAR feed, refreshed every ~3 minutes. Amber = EFVS-recoverable, red = below 300 m.">
        <input id="now-mode" type="checkbox" /> NOW
      </label>
      <span id="now-chip" hidden></span>
    </div>
    </div><!-- /topleft -->

    </div><!-- /topbar-row -->

    <div id="legend">
      <div class="legend-row"><span class="dot glow"></span> fog field — % of hours below CAT I at scrubbed month &amp; local hour</div>
      <div class="legend-row"><span class="dot annual"></span> faint points — analyzed airports · zoom in for per-airport dots</div>
    </div>

    <footer id="scrub">
      <button id="play" aria-label="play">&#9654;</button>
      <div class="sliders">
        <div id="months" title="click a month · drag for a range · ⌘/ctrl-click to add months (e.g. Nov+Dec+Jan)"></div>
        <label>local hour <input id="hr" type="range" min="0" max="23" value="6" /></label>
      </div>
      <div id="readout">January &middot; 06:00</div>
    </footer>

    <aside id="panel" hidden>
      <button id="close" aria-label="close">&times;</button>
      <div id="panel-content"></div>
    </aside>

    <a id="methodology" href="#methodology">methodology &amp; caveats</a>
